<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emailparser</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Consolas', monospace;
            background-color: #1c1c1c;
            color: #ffffff;
        }
        .json-container {
            font-family: 'Consolas', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
            padding: 15px;
            background-color: #343a40;
            color: #ffffff;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        h1, p {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-2">Raw-Email to JSON Parser</h1>
        <p class="text-center">Send an email to <strong>emailparser0@gmail.com</strong> to test it!</p>
        <div id="json-displays"></div>
    </div>

    <script>
        const keyOrder = ["From", "Sender_Email", "Subject", "Message", "Links"];
        fetch('/api/email')
            .then(response => response.json())
            .then(data => {
                const jsonDisplays = document.getElementById('json-displays');
                jsonDisplays.innerHTML = ''; 
                data.forEach(email => {
                    const jsonContainer = document.createElement('div');
                    jsonContainer.className = 'json-container';
                    let orderedJson = "{\n";
                    keyOrder.forEach((key, index) => {
                        if (email[key] !== undefined) {
                            orderedJson += `    "${key}": ${JSON.stringify(email[key], null, 4)}`;
                            if (index < keyOrder.length - 1) orderedJson += ",";
                            orderedJson += "\n";
                        }
                    });
                    orderedJson += "}";
                    jsonContainer.textContent = orderedJson;
                    jsonDisplays.appendChild(jsonContainer);
                });
            })
            .catch(error => console.error('Error fetching JSON:', error));
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
